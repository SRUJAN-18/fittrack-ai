# ===================================================================
# FitTrack AI - Spring Boot Application Configuration
# ===================================================================

server.port=8080

# -------------------------------------------------------------------
# MySQL Database Configuration
# Environment variables allow overriding in production/docker:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fittrack_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Hibernate / JPA Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Google Gemini AI Configuration
# Set your API key in environment variable GEMINI_API_KEY
# or directly replace the value below for local development.
# -------------------------------------------------------------------
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-3.5-flash-lite}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.com.fittrack.ai=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
